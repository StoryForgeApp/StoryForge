name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [
            macos-14, # M1/M2 Apple Silicon runner
            macos-26-intel, # Intel-based macOS runner
            ubuntu-latest, # Ubuntu 24.04 x64 runner
            ubuntu-24.04-arm, # Ubuntu 24.04 ARM runner
            windows-latest, # Windows 2022 x64 runner
            windows-11-arm, # Windows 11 ARM runner
          ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Determine build environment
        id: build-env
        run: |
          echo "env=${{ contains(github.ref_name, '-canary') && 'canary' || 'stable' }}" >> $GITHUB_OUTPUT

      - name: Install rcedit (Windows only)
        if: startsWith(matrix.os, 'windows')
        run: bun install -g rcedit

      - name: Build app
        run: bun run build:${{ steps.build-env.outputs.env == 'canary' && 'canary' || 'stable' }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: combined-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: combined-artifacts/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-canary') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
