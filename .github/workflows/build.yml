name: autofix.ci

on:
  push:
    branches: [main, master, release]
  pull_request:
    branches: [main, master, release]

jobs:
  oxc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: 🧹 Check linting/formatting
        run: bun run format

      - name: ✅ Auto-fix linting/formatting
        uses: autofix-ci/action@v1.3.3

  build:
    needs: oxc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: 🚀 Build
        run: bun run build:stable
